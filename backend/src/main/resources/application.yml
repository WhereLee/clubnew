spring:
  application:
    name: club-flow
  # 默认 dev；生产部署通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # Spring AI 公共配置（所有 profile 生效）：
  # 小米 mimo（OpenAI 兼容协议）；api-key 默认 mock 触发本地假模型（CI/无 key 全链路可跑），
  # 设置环境变量 MIMO_API_KEY 后自动切换真实模型，零代码改动
  ai:
    # 主 embedding 模型：transformers（本地 BGE）——同时关闭 OpenAI embedding 自动配置（mimo 无 embedding 能力）
    model:
      embedding: transformers
    openai:
      base-url: https://api.xiaomimimo.com/v1
      api-key: ${MIMO_API_KEY:mock}
      chat:
        options:
          model: mimo-v2.5
          temperature: 0.7
          max-tokens: 2048
    # 本地中文 embedding（BGE）：路径由环境变量注入，未配置时 RAG 知识库自动降级关闭
    embedding:
      transformer:
        onnx:
          model-uri: ${BGE_MODEL_URI:}
          model-output-name: last_hidden_state
        tokenizer:
          uri: ${BGE_TOKENIZER_URI:}
        cache:
          enabled: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

# MyBatis-Plus 公共配置（SQL 日志等按环境差异项放在各 profile 中覆盖）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# JWT：secret 必须通过环境变量注入（生产环境禁止使用默认值）
jwt:
  secret: ${JWT_SECRET:clubflow2024secretkey1234567890abcdef}
  # access token 有效期（默认 30 分钟）
  expiration: ${JWT_EXPIRATION:1800000}
  # refresh token 有效期（默认 7 天，不透明随机串存 Redis，可吊销可轮换）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# 可观测性：health/info/metrics 暴露（生产可再收紧，只开放 health 给 LB 探活）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: club-flow

springdoc:
  swagger-ui:
    path: /doc.html
