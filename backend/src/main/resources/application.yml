spring:
  application:
    name: club-flow
  # 默认 dev；生产部署通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

# MyBatis-Plus 公共配置（SQL 日志等按环境差异项放在各 profile 中覆盖）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# JWT：secret 必须通过环境变量注入（生产环境禁止使用默认值）
jwt:
  secret: ${JWT_SECRET:clubflow2024secretkey1234567890abcdef}
  expiration: ${JWT_EXPIRATION:1800000}

# 可观测性：health/info/metrics 暴露（生产可再收紧，只开放 health 给 LB 探活）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /doc.html
