# 生产环境模板（云服务器部署）
# 所有敏感配置必须通过环境变量注入，本文件不包含任何真实密钥。
# 启动方式示例：
#   SPRING_PROFILES_ACTIVE=prod \
#   MYSQL_HOST=... MYSQL_USERNAME=... MYSQL_PASSWORD=... \
#   REDIS_HOST=... REDIS_PASSWORD=... JWT_SECRET=... \
#   java -jar app.jar
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:club_flow}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms

# 生产不打印 SQL（日志级别按需调整）
mybatis-plus:
  configuration: {}

# 生产环境关闭 API 文档（避免接口暴露）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.club: info
  file:
    name: ${LOG_PATH:./logs}/club-flow.log
