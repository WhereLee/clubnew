spring:
  datasource:
    url: jdbc:h2:mem:club_flow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    # 与生产共用 db/migration（V1 基线 + V2 索引），保证测试 schema 与生产一致
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  main:
    allow-bean-definition-overriding: true
  ai:
    model:
      # 测试环境禁用 embedding 自动配置（本地 ONNX 模型文件不在 CI 环境；RAG 工具随 @ConditionalOnBean 自动不注册）
      embedding: none

# 测试环境关闭 Stream 消费者（mock Redis 无 stream 能力），发布器自动降级为同步加分
club:
  event:
    stream:
      enabled: false
