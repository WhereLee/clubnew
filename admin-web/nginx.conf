server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（XSS 缓解：限制脚本来源；防 MIME 嗅探；防点击劫持；禁止 object 嵌入）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 静态资源缓存（location 内需重复声明安全头，避免覆盖继承）
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端（后端 context-path=/api，路径原样透传）
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        # 覆盖写入（而非追加）：保证后端拿到的 X-Real-IP / X-Forwarded-For 首值不可被客户端伪造
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 公网入口屏蔽监控端点（actuator 仅供 compose 内网 prometheus/healthcheck 直连 backend 使用）
    location /api/actuator/ {
        return 404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
